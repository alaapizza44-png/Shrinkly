name: Build APK

# Runs on every push, on pull requests, and manually from the "Actions" tab ("Run workflow").
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Flutter version used to compile. Pinned so builds are reproducible.
  # If you ever want the newest, change to a newer version number (e.g. 3.44.0).
  FLUTTER_VERSION: "3.41.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The android/ folder is generated here so you never need Android Studio.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.shrinkly --project-name shrinkly .
          # `flutter create` must not overwrite our own files; restore them just in case.
          git checkout -- lib pubspec.yaml analysis_options.yaml || true
          rm -rf test

      - name: Patch Android project (manifest, service, icons, AdMob id)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 tool/patch_android.py

      # Optional: sign with your own key (see README "Signing"). Without the secrets the build
      # still works but uses the debug key, which Google Play does not accept.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            {
              echo "storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > "$GITHUB_WORKSPACE/android/key.properties"
            # SHA-256 of the signing certificate, used by the in-app integrity check.
            FP=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/android/app/upload-keystore.jks" \
              -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f' || true)
            echo "UPLOAD_SIG=$FP" >> "$GITHUB_ENV"
            echo "Release signing enabled."
          else
            echo "No keystore secrets set: building with the debug key (fine for testing)."
          fi

      # Exact plugin version (1.10.0 supports fractional bitrates).
      - name: Pin compression plugin version
        run: |
          sed -i 's/^  light_compressor_v2:.*/  light_compressor_v2: 1.10.0/' pubspec.yaml
          grep -n light_compressor_v2 pubspec.yaml

      - name: Get packages
        run: flutter pub get

      # The plugin does not apply the Kotlin compiler plugin itself, so its Kotlin code was never
      # compiled ("cannot find symbol LightCompressorPlugin"). Add it here.
      - name: Fix plugin Kotlin setup
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse
          cfg = json.load(open('.dart_tool/package_config.json'))
          for p in cfg['packages']:
              if p['name'] != 'light_compressor_v2':
                  continue
              root = p['rootUri']
              if root.startswith('file://'):
                  root = urllib.parse.unquote(root[len('file://'):])
              else:
                  root = os.path.normpath(os.path.join('.dart_tool', root))
              f = os.path.join(root, 'android', 'build.gradle.kts')
              s = open(f).read()
              if 'kotlin-android' not in s and 'org.jetbrains.kotlin.android' not in s:
                  s2 = re.sub(r'plugins\s*\{', 'plugins {\n    id("kotlin-android")', s, count=1)
                  if s2 != s:
                      open(f, 'w').write(s2)
                      print('>>> PATCHED: added the kotlin-android plugin')
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # --obfuscate makes the compiled code hard to read; the symbols are kept as an artifact so
      # crash reports can still be decoded.
      - name: Build release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info \
            --dart-define=APP_SIGS="$UPLOAD_SIG" \
            --dart-define=ADMOB_BANNER_ID="${{ secrets.ADMOB_BANNER_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${{ secrets.ADMOB_INTERSTITIAL_ID }}" \
            --dart-define=ADMOB_REWARDED_ID="${{ secrets.ADMOB_REWARDED_ID }}" \
            --dart-define=ADMOB_NATIVE_ID="${{ secrets.ADMOB_NATIVE_ID }}"

      # The Play Store re-signs the app with Google's key, so the check is only switched on in the
      # bundle once you add that key's SHA-256 as the secret PLAY_SIGNING_SHA256.
      - name: Build Play Store bundle (.aab)
        env:
          PLAY_SIG: ${{ secrets.PLAY_SIGNING_SHA256 }}
        run: |
          AAB_SIGS=""
          if [ -n "$PLAY_SIG" ]; then
            PS=$(echo "$PLAY_SIG" | tr -d ': ' | tr 'A-F' 'a-f')
            AAB_SIGS="$PS,$UPLOAD_SIG"
          fi
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info \
            --dart-define=APP_SIGS="$AAB_SIGS" \
            --dart-define=ADMOB_BANNER_ID="${{ secrets.ADMOB_BANNER_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${{ secrets.ADMOB_INTERSTITIAL_ID }}" \
            --dart-define=ADMOB_REWARDED_ID="${{ secrets.ADMOB_REWARDED_ID }}" \
            --dart-define=ADMOB_NATIVE_ID="${{ secrets.ADMOB_NATIVE_ID }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkly-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkly-debug-symbols
          path: build/debug-info
          if-no-files-found: ignore
          retention-days: 30
