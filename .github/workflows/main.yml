name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.shrinkly --project-name shrinkly .
          git checkout -- lib pubspec.yaml analysis_options.yaml || true
          rm -rf test

      - name: Patch Android project (manifest, icons, AdMob id)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: python3 tool/patch_android.py

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            {
              echo "storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > "$GITHUB_WORKSPACE/android/key.properties"
            echo "Release signing enabled."
          else
            echo "No keystore secrets set: building with the debug key (fine for testing)."
          fi

      - name: Pin compression plugin version
        run: |
          sed -i 's/^  light_compressor_v2:.*/  light_compressor_v2: 1.9.1/' pubspec.yaml
          grep -n light_compressor_v2 pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Show plugin info (debug)
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse
          cfg = json.load(open('.dart_tool/package_config.json'))
          for p in cfg['packages']:
              if p['name'] != 'light_compressor_v2':
                  continue
              root = p['rootUri']
              if root.startswith('file://'):
                  root = urllib.parse.unquote(root[len('file://'):])
              else:
                  root = os.path.normpath(os.path.join('.dart_tool', root))
              print('plugin root:', root)
              ps = open(os.path.join(root, 'pubspec.yaml')).read()
              i = ps.find('plugin:')
              print(ps[i:i + 500])
              for d, _, fs in os.walk(os.path.join(root, 'android')):
                  for f in fs:
                      if f.endswith(('.kt', '.java', '.gradle', '.kts')):
                          print('file:', os.path.join(d, f))
                          if 'Plugin' in f:
                              print(''.join(open(os.path.join(d, f)).readlines()[:25]))
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=ADMOB_BANNER_ID="${{ secrets.ADMOB_BANNER_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${{ secrets.ADMOB_INTERSTITIAL_ID }}"

      - name: Build Play Store bundle (.aab)
        run: |
          flutter build appbundle --release \
            --dart-define=ADMOB_BANNER_ID="${{ secrets.ADMOB_BANNER_ID }}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${{ secrets.ADMOB_INTERSTITIAL_ID }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shrinkly-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
