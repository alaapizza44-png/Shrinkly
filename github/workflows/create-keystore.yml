name: Create signing key (run once)

# Run manually ONCE per repository from the Actions tab.
#
# * If the repository secret GH_PAT exists (a personal access token that may write repository
#   secrets), the four signing secrets are created for you automatically.
# * Otherwise open the finished run, download the artifact and copy the values into
#   Settings > Secrets and variables > Actions by hand.
#
# Either way a BACKUP artifact is kept for 90 days: download it and store it somewhere safe
# (password manager / drive). If the key is ever lost you can no longer update the app.
# The workflow refuses to run when KEYSTORE_BASE64 already exists, so it can never overwrite a key.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      EXISTING: ${{ secrets.KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Stop if a key already exists
        run: |
          if [ -n "$EXISTING" ]; then
            echo "A signing key already exists in this repository's secrets. Not creating another one."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload-keystore.jks -storetype JKS \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=${GITHUB_REPOSITORY_OWNER}, O=${GITHUB_REPOSITORY_OWNER}, C=EG"
          base64 -w0 upload-keystore.jks > KEYSTORE_BASE64.txt
          echo -n "$PASS" > KEYSTORE_PASSWORD.txt
          echo -n "upload" > KEY_ALIAS.txt
          echo "Signing certificate SHA-256 (the app's integrity check uses it):"
          keytool -list -v -keystore upload-keystore.jks -alias upload -storepass "$PASS" | grep 'SHA256:'
          mkdir backup
          mv upload-keystore.jks backup/
          cp KEYSTORE_PASSWORD.txt KEY_ALIAS.txt backup/
      - name: Save the secrets in the repository (needs GH_PAT)
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT is not set: copy the values from the artifact by hand."
            exit 0
          fi
          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < KEYSTORE_BASE64.txt
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" < KEYSTORE_PASSWORD.txt
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" < KEY_ALIAS.txt
          echo "Secrets saved. You can now run the build."
      - name: Upload backup (keep it safe, then delete the artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-BACKUP
          path: |
            backup/upload-keystore.jks
            backup/KEYSTORE_PASSWORD.txt
            backup/KEY_ALIAS.txt
            KEYSTORE_BASE64.txt
          retention-days: 90
