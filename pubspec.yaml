name: shrinkly
description: Shrinkly - shrink videos to the size you need, privately on your phone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  light_compressor_v2: 1.10.0
  file_picker: '>=8.1.4 <11.0.0'
  permission_handler: '>=11.3.1 <13.0.0'
  shared_preferences: ^2.3.2
  google_mobile_ads: '>=6.0.0 <10.0.0'

flutter:
  uses-material-design: true
